<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

  h1 { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; color: #2a9d8f; margin-bottom: 0.75rem; }
  p { color: #888; line-height: 1.7; margin-bottom: 1.5rem; }
  a { display: inline-block; padding: 12px 28px; background: #e63946; color: #fff; border-radius: 10px; text-decoration: none; font-family: 'Syne', sans-serif; font-weight: 700; transition: background 0.15s; }
  a:hover { background: #c1121f; }
</style>
</head>

<div class="card">
  <div class="emoji">✅</div>
