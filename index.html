<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Flag Detector</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e63946;
    --red-dark: #c1121f;
    --bg: #0d0d0d;
    --surface: #181818;
    --surface2: #222;
    --border: rgba(255,255,255,0.08);
    --text: #f0f0f0;
    --muted: #888;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
  header { width: 100%; padding: 2.5rem 2rem 1.5rem; text-align: center; border-bottom: 1px solid var(--border); position: relative; overflow: hidden; }
  header::before { content: '🚩'; position: absolute; font-size: 180px; opacity: 0.04; top: -30px; left: 50%; transform: translateX(-50%); pointer-events: none; }
  h1 { font-family: 'Syne', sans-serif; font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 800; letter-spacing: -0.02em; color: var(--red); line-height: 1; }
  .subtitle { font-size: 0.95rem; color: var(--muted); margin-top: 0.5rem; }
  main { width: 100%; max-width: 680px; padding: 2rem 1.5rem 4rem; display: flex; flex-direction: column; gap: 1.25rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; }
  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 10px; display: block; }
  input[type="email"] { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text); outline: none; transition: border-color 0.2s; }
  input[type="email"]:focus { border-color: var(--red); }
  input[type="email"]::placeholder { color: #555; }
  .credits-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .credits-badge { font-size: 13px; color: var(--muted); }
  .credits-badge span { color: var(--red); font-weight: 500; }
  .buy-btn { font-size: 12px; padding: 6px 12px; background: transparent; border: 1px solid var(--red); color: var(--red); border-radius: 6px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .buy-btn:hover { background: var(--red); color: #fff; }
  .tabs { display: flex; gap: 6px; margin-bottom: 1.25rem; }
  .tab { flex: 1; padding: 9px 6px; font-size: 13px; font-family: 'DM Sans', sans-serif; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s; }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--red); border-color: var(--red); color: #fff; font-weight: 500; }
  textarea { width: 100%; min-height: 140px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text); resize: vertical; outline: none; line-height: 1.6; transition: border-color 0.2s; }
  textarea:focus { border-color: var(--red); }
  textarea::placeholder { color: #555; }
  .detect-btn { width: 100%; margin-top: 1rem; padding: 14px; font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.03em; background: var(--red); color: #fff; border: none; border-radius: 10px; cursor: pointer; transition: all 0.15s; }
  .detect-btn:hover { background: var(--red-dark); transform: translateY(-1px); }
  .detect-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .score-row { display: flex; align-items: center; gap: 20px; margin-bottom: 1.5rem; }
  .score-num { font-family: 'Syne', sans-serif; font-size: 64px; font-weight: 800; line-height: 1; }
  .score-meta { flex: 1; }
  .verdict-text { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .score-sub { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .bar-track { height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; }
  .flags-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 8px; }
  .flag-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--border); font-size: 14px; line-height: 1.5; }
  .summary { font-size: 14px; color: #aaa; line-height: 1.8; padding-top: 1.25rem; border-top: 1px solid var(--border); margin-top: 0.5rem; }
  .dots { display: flex; gap: 6px; justify-content: center; padding: 2rem; }
  .dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: bounce 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }
  .err { color: var(--red); font-size: 13px; padding: 1rem; background: rgba(230,57,70,0.08); border-radius: 8px; border: 1px solid rgba(230,57,70,0.2); line-height: 1.6; }
  footer { width: 100%; text-align: center; padding: 1.5rem; font-size: 12px; color: #444; border-top: 1px solid var(--border); }
</style>
</head>
<body>

<header>
  <h1>🚩 Red Flag Detector</h1>
  <p class="subtitle">Paste texts, a dating profile, or describe a situation. Get a verdict.</p>
</header>

<main>
  <div class="card">
    <span class="section-label">Your email (to track your credits)</span>
    <input type="email" id="email" placeholder="you@example.com" onblur="checkCredits()" />
    <div class="credits-row">
      <span class="credits-badge">Credits remaining: <span id="credit-count">—</span></span>
      <button class="buy-btn" onclick="buyCredits()">Buy 10 scans — $1.99</button>
    </div>
  </div>

  <div class="card">
    <span class="section-label">What are you analyzing?</span>
    <div class="tabs">
      <button class="tab active" onclick="setMode('text messages', this)">💬 Texts</button>
      <button class="tab" onclick="setMode('dating profile', this)">👤 Dating profile</button>
      <button class="tab" onclick="setMode('situation', this)">⚠️ A situation</button>
    </div>
    <span class="section-label" id="input-label">Paste or describe the texts</span>
    <textarea id="rf-input" placeholder='e.g. "He said he loves me but also needs space and his ex is his best friend lol"'></textarea>
    <button class="detect-btn" onclick="analyze()" id="analyze-btn">🚩 Detect Red Flags</button>
  </div>

  <div id="result-area"></div>
</main>

<footer>Powered by Claude AI &mdash; $1.99 for 10 scans</footer>

<script>
let currentMode = 'text messages';

function setMode(mode, el) {
  currentMode = mode;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const labels = { 'text messages': 'Paste or describe the texts', 'dating profile': 'Paste the bio or describe the profile', 'situation': 'Describe the situation' };
  const placeholders = { 'text messages': '"He said he loves me but needs space and his ex is his best friend lol"', 'dating profile': '"Not here for hookups (but open to it). My ex was crazy."', 'situation': '"He texts every day but cancels every weekend."' };
  document.getElementById('input-label').textContent = labels[mode];
  document.getElementById('rf-input').placeholder = placeholders[mode];
}

async function checkCredits() {
  const email = document.getElementById('email').value.trim();
  if (!email) return;
  const res = await fetch('/api/credits', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
  const data = await res.json();
  document.getElementById('credit-count').textContent = data.credits ?? 0;
}

async function buyCredits() {
  const email = document.getElementById('email').value.trim();
  if (!email) { alert('Enter your email first!'); return; }
  const res = await fetch('/api/buy-credits', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
  const data = await res.json();
  if (data.url) window.location.href = data.url;
  else alert('Error: ' + data.error);
}

function getScoreColor(score) {
  if (score >= 75) return '#e63946';
  if (score >= 50) return '#f4a261';
  if (score >= 25) return '#e9c46a';
  return '#2a9d8f';
}

function getVerdict(score) {
  if (score >= 85) return '🚨 Absolutely run';
  if (score >= 65) return '🚩 Major red flags';
  if (score >= 40) return '⚠️ Proceed with caution';
  if (score >= 20) return '🟡 Minor concerns';
  return '✅ Actually fine?';
}

async function analyze() {
  const email = document.getElementById('email').value.trim();
  const input = document.getElementById('rf-input').value.trim();
  const resultArea = document.getElementById('result-area');
  const btn = document.getElementById('analyze-btn');

  if (!email) { resultArea.innerHTML = '<div class="err">Enter your email above first.</div>'; return; }
  if (!input) { resultArea.innerHTML = '<div class="err">Enter something to analyze.</div>'; return; }

  btn.disabled = true;
  btn.textContent = 'Analyzing...';
  resultArea.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';

  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, mode: currentMode, input })
    });
    const data = await res.json();
    if (!res.ok) {
      resultArea.innerHTML = `<div class="err">${data.error}${res.status === 402 ? ' <button class="buy-btn" onclick="buyCredits()" style="margin-left:8px">Buy more</button>' : ''}</div>`;
      btn.disabled = false; btn.textContent = '🚩 Detect Red Flags'; return;
    }

    const score = Math.round(data.score);
    const color = getScoreColor(score);
    document.getElementById('credit-count').textContent = data.creditsRemaining;

    resultArea.innerHTML = `
      <div class="result-card">
        <div class="score-row">
          <div class="score-num" style="color:${color}">${score}</div>
          <div class="score-meta">
            <div class="verdict-text" style="color:${color}">${getVerdict(score)}</div>
            <div class="score-sub">Red flag score / 100</div>
            <div class="bar-track"><div class="bar-fill" style="width:${score}%; background:${color};"></div></div>
          </div>
        </div>
        <p class="flags-label">Flags detected</p>
        ${data.flags.map(f => `<div class="flag-item"><span>🚩</span><span>${f}</span></div>`).join('')}
        <p class="summary">${data.summary}</p>
      </div>`;
  } catch (e) {
    resultArea.innerHTML = `<div class="err">Error: ${e.message}</div>`;
  }
  btn.disabled = false;
  btn.textContent = '🚩 Detect Red Flags';
}
</script>
</body>
</html>
